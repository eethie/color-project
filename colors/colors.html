<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Color Manager</title>

    <link rel="stylesheet" href="colors.css">
</head>

<body>

    <header class="title-header">
        <div class="logo-box-solid">
            <span></span>
        </div>

        <h1>COLOR MANAGER</h1>
    </header>


    <div class="color-search">
        <input
            class="color-add-input"
            type="text"
            id="addInput"
            placeholder="Enter your color"
        >

        <button id="searchButton">
            Add Color
        </button>

        <input
            class="color-search-input"
            type="text"
            id="searchInput"
            placeholder="Enter your color"
        >

        <button id="searchButton">
            Search
        </button>

        <div class="color-output">
            <output id="colorOutput"></output>
        </div>





    <script src="colors.js"></script>

</body>

</html>
